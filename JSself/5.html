<!DOCTYPE html>
<html>
    <head>
        <title>Self Modifying Page</title>
        <script>
            function modify() {
                document.body.style.backgroundColor = "lightblue";
                document.getElementById("msg").innerHTML = "Page has been modified!";
            }

            setInterval(modify, 60000);
        </script>
    </head>
    <body>
        <h2>Self Modifying Page</h2>
        <p id="msg">Page will modify itself after 1 minute...</p>
    </body>
</html>
