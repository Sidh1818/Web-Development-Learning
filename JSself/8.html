<!DOCTYPE html>
<html>
    <head>
        <title>Telephone Number Parser</title>
        <script>
            function parsePhone() {
                var phone = document.getElementById("phone").value;

                var part1 = phone.split(")");
                var areaCode = part1[0].split("(")[1];
                var number = part1[1];

                document.getElementById("area").value = areaCode;
                document.getElementById("num").value = number;
            }
        </script>
    </head>
    <body>
        <h2>Telephone Number Parser</h2>

        Enter Phone Number:
        <input type="text" id="phone" placeholder="(555)555-5555">
        <br><br>

        <button onclick="parsePhone()">Extract</button>
        <br><br>

        Area Code:
        <input type="text" id="area" readonly>
        <br><br>

        Phone Number:
        <input type="text" id="num" readonly>
    </body>
</html>
